services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${UNIPASS_BIND_ADDRESS:-127.0.0.1}:4000:4000"
    env_file: .env
    volumes:
      - unipass_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && node dist/index.js"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unipass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: unipass
    volumes:
      - unipass_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unipass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  unipass_db:
  unipass_uploads:
